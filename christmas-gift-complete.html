:root{--ink:#5a4840;--cream:#fdf8f1;--red:#e0675e;--red2:#ef8f86;--green:#7fa88f;--green2:#5f8a72;--gold:#eec26b;--blush:#fbe6e1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e9f0f5;font-family:'Caveat',cursive;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity 1.3s ease,visibility 0s linear 1.3s}
.scene.on{opacity:1;visibility:visible;transition:opacity 1.3s ease}
.bob{position:absolute;inset:0}
.bob.walking{animation:bob .6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.rough{filter:url(#rough)}
#snow{position:absolute;inset:0;pointer-events:none;z-index:5;transition:opacity 1.2s}
#flash{position:absolute;inset:0;background:#fff4dc;opacity:0;pointer-events:none;z-index:8;transition:opacity 1s ease}
#flash.on{opacity:1}
.layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.layer .pe{pointer-events:auto}
.grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.5;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .36  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:59;box-shadow:inset 0 0 120px rgba(120,90,70,.18)}

/* paper & buttons */
.card{background:#fffaf2;border:2.5px solid var(--ink);border-radius:22px 28px 20px 30px/28px 20px 30px 22px;box-shadow:4px 6px 0 rgba(90,72,64,.13)}
.btn{font-family:'Patrick Hand',cursive;font-size:22px;line-height:1.1;padding:10px 22px 11px;border:2.5px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;background:var(--red);color:#fff;cursor:pointer;box-shadow:3px 4px 0 rgba(90,72,64,.22);transition:transform .2s,box-shadow .2s;letter-spacing:.3px}
.btn:hover{transform:translateY(-2px) rotate(-1.2deg);box-shadow:4px 6px 0 rgba(90,72,64,.22)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.green{background:var(--green)}
.btn.small{font-size:18px;padding:6px 14px 7px}
.hidden{display:none!important}
.fade{transition:opacity .9s ease,transform .9s ease}
.out{opacity:0;transform:translateY(10px);pointer-events:none!important}

/* intro */
#intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:34px 38px 30px;width:min(88vw,460px);transition:opacity 1s,transform 1s}
#intro.gone{opacity:0;transform:translate(-50%,-44%);pointer-events:none}
#intro .small-t{font-family:'Patrick Hand';font-size:20px;opacity:.75}
#intro h1{font-family:'Homemade Apple',cursive;font-weight:400;font-size:clamp(34px,7vw,48px);color:var(--red);margin:14px 0 20px;line-height:1.5}
#intro .note{font-family:'Patrick Hand';font-size:17px;opacity:.6;margin-top:16px}
.holly{display:block;margin:0 auto -6px;width:90px}

#narr{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:min(92vw,900px);text-align:center;font-family:'Caveat Brush',cursive;font-size:clamp(32px,5.6vw,60px);line-height:1.15;color:var(--ink);text-shadow:0 0 6px #fff,0 0 22px #fff,0 0 34px #fff;opacity:0;transition:opacity 1.2s ease}
#narr.show{opacity:1}
#narr small{display:block;font-family:'Caveat';font-size:.55em;margin-top:6px}

#prompt{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);text-align:center;padding:20px 26px 22px;width:min(92vw,520px)}
#prompt.out{transform:translate(-50%,16px)}
#prompt h2{font-family:'Caveat Brush';font-weight:400;font-size:clamp(30px,5vw,40px);margin-bottom:14px}
#prompt .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* outdoor svg bits */
.bulb{animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
.star-tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.smoke{animation:smoke 4.5s linear infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.85}100%{transform:translate(40px,-150px) scale(1.7);opacity:0}}
.cloud{animation:drift 60s linear infinite alternate}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(80px)}}
.flk{animation:flk 1.6s ease-in-out infinite}
@keyframes flk{0%,100%{opacity:.75}35%{opacity:1}60%{opacity:.6}80%{opacity:.95}}
.robin{animation:robin 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes robin{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-14deg)}84%{transform:rotate(3deg)}}
#door{transform-box:fill-box;transform-origin:0% 50%;transition:transform 1.4s cubic-bezier(.5,0,.25,1),filter 1.4s}
#door.open{transform:scaleX(.1) skewY(-12deg);filter:brightness(.8)}
#spill{opacity:0;transition:opacity 1.6s ease .3s}
#spill.on{opacity:1}
.fp{opacity:0;transition:opacity .5s}
.fp.show{opacity:.85}
#yardSnowman{cursor:pointer}
#yardSnowman:hover{filter:brightness(1.05)}

/* room */
.wall{position:absolute;left:-3000px;right:-3000px;top:-3000px;height:3600px;background:radial-gradient(circle at 15px 15px,rgba(224,103,94,.28) 2px,transparent 2.6px) 0 0/50px 50px,radial-gradient(circle at 40px 40px,rgba(127,168,143,.3) 2px,transparent 2.6px) 0 0/50px 50px,repeating-linear-gradient(90deg,#fcf3e8 0 25px,#f9ecdd 25px 50px)}
.floor{position:absolute;left:-3000px;right:-3000px;top:600px;height:3000px;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(90,72,64,.18) 118px 120px),linear-gradient(#e7cba9,#e2c19c);border-top:4px solid #cfa983}
.baseboard{position:absolute;left:-3000px;right:-3000px;top:586px;height:16px;background:#fffaf3;border-top:2px solid rgba(90,72,64,.5);border-bottom:2px solid rgba(90,72,64,.5)}
.room-svg{position:absolute;left:0;top:0;width:1000px;height:700px;overflow:visible}
.frame{position:absolute;border:7px solid #c99a72;background:#fffdf8;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink),3px 5px 0 rgba(90,72,64,.16);padding:5px;cursor:default}
.frame .ph{position:absolute;inset:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#fdf1ea 0 6px,#fbe8df 6px 12px);font-family:'Caveat';font-size:12px;line-height:1;text-align:center;color:#a07f72;border:1px dashed #d9b7a8}
.frame .ph b{font-family:'Caveat Brush';font-weight:400;font-size:20px;color:var(--red)}
.frame img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);object-fit:cover}
.frame.edit{cursor:pointer}
.warm{position:absolute;left:-200px;top:120px;width:1400px;height:760px;background:radial-gradient(ellipse at 50% 62%,rgba(255,196,110,.32),rgba(255,196,110,0) 55%);pointer-events:none;animation:warm 3s ease-in-out infinite;mix-blend-mode:multiply}
@keyframes warm{0%,100%{opacity:.85}50%{opacity:1}}
.flame{transform-box:fill-box;transform-origin:50% 100%}
.f1{animation:fl1 1.1s ease-in-out infinite}
.f2{animation:fl2 .8s ease-in-out infinite}
.f3{animation:fl1 .6s ease-in-out infinite reverse}
@keyframes fl1{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(1.04,.93) skewX(3deg)}50%{transform:scale(.96,1.08) skewX(-3deg)}75%{transform:scale(1.02,.97) skewX(2deg)}}
@keyframes fl2{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.95,1.1) skewX(-4deg)}60%{transform:scale(1.05,.92) skewX(3deg)}}
.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.ember{animation:ember 2.6s linear infinite;opacity:0;transform-box:fill-box}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(10px,-110px);opacity:0}}
.steam{animation:steam 2.8s ease-in-out infinite;opacity:0}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-16px)}}
.zz{animation:zz 3s ease-in-out infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(14px,-26px)}}
.wsnow{animation:wsnow 5s linear infinite}
@keyframes wsnow{from{transform:translateY(-30px)}to{transform:translateY(280px)}}
.candleflame{animation:fl2 .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

#caption{position:absolute;left:50%;bottom:7%;transform:translateX(-50%) rotate(-1.5deg);padding:10px 24px 12px;font-family:'Caveat Brush';font-size:clamp(26px,4.4vw,38px);text-align:center;max-width:88vw;transition:opacity .7s,transform .7s}
#caption.out{transform:translate(-50%,14px) rotate(-1.5deg)}
#caption .num{display:block;font-family:'Patrick Hand';font-size:15px;opacity:.55}
#skip{position:absolute;right:18px;bottom:18px}
#fireText{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(92vw,860px);text-align:center;font-family:'Caveat Brush';font-size:clamp(30px,5.2vw,54px);line-height:1.2;color:#fff;text-shadow:0 2px 0 rgba(90,72,64,.55),0 0 14px rgba(140,80,50,.55),0 0 30px rgba(140,80,50,.35)}
#fireText span{display:inline-block;opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s}
#fireText span.on{opacity:1;transform:none}
#fireNext{position:absolute;left:50%;bottom:6%;transform:translateX(-50%)}
#fireNext.out{transform:translate(-50%,14px)}

/* letter */
#sc-letter{background:radial-gradient(ellipse at 50% 40%,#fff9f2 0%,#fbeae3 60%,#f4d9d2 100%)}
.garland-top{position:absolute;left:0;right:0;top:-6px;height:90px;width:100%}
#env{position:absolute;left:50%;top:52%;width:min(86vw,500px);height:calc(min(86vw,500px)*.64);transform:translate(-50%,-50%);perspective:1400px;cursor:pointer;transition:transform 1.1s ease,opacity 1s}
#env.wiggle{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:translate(-50%,-50%) rotate(0)}84%{transform:translate(-50%,-50%) rotate(-2.5deg)}88%{transform:translate(-50%,-50%) rotate(2.5deg)}92%{transform:translate(-50%,-50%) rotate(-1.5deg)}}
#env.opened{cursor:default}
#env.down{transform:translate(-50%,40%) scale(.9);opacity:0}
#env svg,#env .peek,#env .front-txt{position:absolute}
#env .eback{left:0;top:0;width:100%;height:100%;z-index:1}
#env .peek{left:7%;right:7%;top:6%;height:86%;z-index:2;background:repeating-linear-gradient(#fffaf3 0 17px,#efe0d4 17px 18px);border:2px solid var(--ink);border-radius:4px;transition:transform 1s cubic-bezier(.4,0,.2,1) .75s;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-family:'Caveat Brush';font-size:24px;color:var(--red)}
#env .efront{left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none}
#env .flap{left:0;top:0;width:100%;height:62%;z-index:4;transform-origin:50% 0;transition:transform .9s cubic-bezier(.5,0,.3,1),z-index 0s linear .42s}
#env.opened .flap{transform:rotateX(180deg);z-index:1}
#env.opened .peek{transform:translateY(-66%)}
#env .seal{position:absolute;left:50%;top:54%;width:56px;height:56px;margin:-28px 0 0 -28px;z-index:5;transition:transform .45s cubic-bezier(.5,-.6,.5,1.6),opacity .4s}
#env.opened .seal{transform:scale(0) rotate(40deg);opacity:0}
#env .front-txt{left:0;right:0;bottom:9%;z-index:4;text-align:center;pointer-events:none}
#env .front-txt .mc{font-family:'Homemade Apple';font-size:clamp(20px,5.6vw,30px);color:var(--red);line-height:1.4}
#env .front-txt .to{font-family:'Caveat';font-size:clamp(19px,4.4vw,24px);margin-top:2px}
#envHint{position:absolute;left:50%;top:calc(52% + min(86vw,500px)*.32 + 18px);transform:translateX(-50%);font-family:'Patrick Hand';font-size:20px;opacity:.7;transition:opacity .6s;white-space:nowrap}
#letterTitle{position:absolute;left:50%;top:9%;transform:translateX(-50%);font-family:'Caveat Brush';font-size:clamp(28px,5vw,42px);white-space:nowrap;transition:opacity .8s}
#paper{position:absolute;left:50%;top:50%;width:min(92vw,620px);max-height:86vh;transform:translate(-50%,-46%) scale(.85);opacity:0;pointer-events:none;transition:opacity 1s ease,transform 1s cubic-bezier(.3,1.3,.5,1);display:flex;flex-direction:column}
#paper.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#paper .sheet{overflow:auto;-webkit-overflow-scrolling:touch;padding:26px 28px 22px 64px;background:linear-gradient(90deg,transparent 46px,#f2b9b1 46px 48px,transparent 48px),repeating-linear-gradient(#fffaf3 0 35px,#ead9cc 35px 36px);background-attachment:local;border:2.5px solid var(--ink);border-radius:6px 10px 8px 12px;box-shadow:5px 7px 0 rgba(90,72,64,.13);position:relative;-webkit-user-select:text;user-select:text}
#paper h3{font-family:'Caveat Brush';font-weight:400;font-size:clamp(30px,5.6vw,40px);color:var(--red);line-height:36px;margin:0 0 0;padding-right:60px}
#paper .body{font-family:'Caveat';font-size:clamp(22px,4.2vw,27px);line-height:36px;white-space:pre-wrap;margin-top:0}
#paper .sign{font-family:'Caveat';font-size:clamp(22px,4.2vw,27px);line-height:36px;text-align:right;margin-top:36px}
#paper .sign b{display:block;font-family:'Homemade Apple';font-weight:400;font-size:clamp(20px,4.6vw,26px);color:var(--red);line-height:44px}
#paper .doodle{position:absolute;right:12px;top:10px;width:70px}
#paper .btn{align-self:center;margin-top:16px}

/* love */
#sc-love{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#fff8f3 0%,#fde6e4 55%,#f7d3d3 100%)}
#loveSvg{position:relative;width:min(94vw,620px,calc(66vh*1.143));overflow:visible;flex:none}
.draw{fill:var(--red);fill-opacity:0;stroke:var(--red);stroke-width:2.2;stroke-dasharray:1400;stroke-dashoffset:1400}
.draw.go{animation:draw 3.2s ease forwards,fillin 1.2s ease 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}
.beat{animation:beat 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 60%;cursor:pointer}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(.97)}42%{transform:scale(1.08)}60%{transform:scale(1)}}
.floaty{animation:floaty 3.4s ease-in-out infinite;transform-box:fill-box}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.lean-l{animation:leanl 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.lean-r{animation:leanr 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes leanl{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes leanr{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
#loveSub{position:relative;margin-top:8px;text-align:center;width:92vw;opacity:0;transition:opacity 1.4s ease}
#loveSub.show{opacity:1}
#loveSub .l1{font-family:'Caveat Brush';font-size:clamp(26px,4.6vw,38px)}
#loveSub .l2{font-family:'Homemade Apple';font-size:clamp(17px,3.4vw,22px);color:var(--red);margin:6px 0 16px}
.fh{position:absolute;bottom:-40px;pointer-events:none;animation:rise linear forwards;font-family:'Caveat Brush'}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx),-115vh) rotate(var(--r));opacity:0}}

/* game */
#sc-game{cursor:crosshair;touch-action:none}
#gameBg{position:absolute;inset:0;width:100%;height:100%}
#smWrap{position:absolute;bottom:13%;left:50%;width:min(30vh,40vw);height:calc(min(30vh,40vw)*1.5);margin-left:calc(min(30vh,40vw)*-.5);will-change:transform}
#smWrap .inner{width:100%;height:100%;transform-origin:50% 100%}
#smWrap .inner.hit{animation:wob .6s ease}
@keyframes wob{0%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.03,.96)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
.snowman-svg,.tree-svg{width:100%;height:100%;overflow:visible}
.sm-hat{transform-box:fill-box;transform-origin:50% 100%}
.hatpop .sm-hat{animation:hatpop .8s cubic-bezier(.3,.8,.4,1)}
@keyframes hatpop{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-38px) rotate(-25deg)}100%{transform:translateY(0) rotate(0)}}
#treeWrap{position:absolute;bottom:15%;left:8%;width:min(24vh,26vw);height:calc(min(24vh,26vw)*1.45)}
#treeWrap .inner{width:100%;height:100%;transform-origin:50% 100%}
#treeWrap .inner.hit{animation:shake .6s ease}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.ball{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff 0 40%,#e6eef5 70%,#c8d7e3);border:2.2px solid var(--ink);pointer-events:none;z-index:6}
.splat{position:absolute;pointer-events:none;z-index:5;width:60px;height:40px;margin:-20px 0 0 -30px;animation:splat 1.2s ease forwards}
@keyframes splat{0%{transform:scale(.3);opacity:1}25%{transform:scale(1.05)}70%{opacity:1}100%{transform:scale(1);opacity:0}}
.pop{position:absolute;pointer-events:none;z-index:7;font-family:'Caveat Brush';font-size:34px;color:var(--red);text-shadow:0 0 8px #fff,0 0 16px #fff;animation:popup 1.2s ease forwards;white-space:nowrap;transform:translate(-50%,-50%)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
#score{position:absolute;left:50%;top:16px;transform:translateX(-50%) rotate(-1deg);padding:8px 22px 10px;font-family:'Caveat Brush';font-size:28px;text-align:center;white-space:nowrap}
#score small{display:block;font-family:'Patrick Hand';font-size:15px;opacity:.6}
#gameBack{position:absolute;left:16px;bottom:16px}
#aim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#gameWin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:24px 28px;width:min(90vw,440px);z-index:9}
#gameWin.out{transform:translate(-50%,-44%)}
#gameWin h2{font-family:'Caveat Brush';font-weight:400;font-size:38px;color:var(--red)}
#gameWin p{font-size:24px;margin:4px 0 16px}

/* corner buttons */
.corner{position:fixed;z-index:40;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ink);background:#fffaf2;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:2px 3px 0 rgba(90,72,64,.2);font-size:20px;transition:transform .2s}
.corner:hover{transform:rotate(-8deg) scale(1.05)}
#soundBtn{right:14px;top:14px}
#editBtn{left:14px;top:14px;width:auto;padding:0 16px;border-radius:24px;font-family:'Patrick Hand';font-size:18px;gap:6px}

/* editor */
#editor{position:fixed;right:0;top:0;bottom:0;width:min(100vw,430px);z-index:70;background:#fffaf2;border-left:2.5px solid var(--ink);box-shadow:-6px 0 0 rgba(90,72,64,.08);transform:translateX(105%);transition:transform .45s ease;display:flex;flex-direction:column;font-family:'Patrick Hand',cursive;-webkit-user-select:text;user-select:text}
#editor.open{transform:none}
#editor header{padding:18px 20px 10px;border-bottom:2px dashed rgba(90,72,64,.3)}
#editor header h2{font-family:'Caveat Brush';font-weight:400;font-size:32px;color:var(--red)}
#editor header p{font-size:15px;opacity:.75;line-height:1.35}
#editor .body{flex:1;overflow:auto;padding:14px 20px 24px}
#editor label{display:block;font-size:17px;margin:14px 0 5px}
#editor input[type=text],#editor textarea{width:100%;font-family:'Caveat',cursive;font-size:22px;padding:6px 10px;border:2px solid var(--ink);border-radius:10px 14px 9px 13px;background:#fff;color:var(--ink);outline:none}
#editor textarea{min-height:90px;resize:vertical;line-height:1.3}
#editor textarea#eLetter{min-height:260px}
#editor .ph-row{display:flex;gap:10px;align-items:center;margin-top:8px}
#editor .thumb{width:70px;height:70px;flex:none;border:2px solid var(--ink);border-radius:8px;background:#fbe8df center/cover no-repeat;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;line-height:1.05;color:#a07f72}
#editor .ph-row .col{flex:1;display:flex;flex-direction:column;gap:6px}
#editor .ph-row .acts{display:flex;gap:6px}

/* ---------------- scene control ---------------- */
var current = 'out', runId = 0, skipFn = null;
function show(name) { $$('.scene').forEach(function (s) { s.classList.toggle('on', s.id === 'sc-' + name); }); current = name; }
function outEl(el, out) { el.classList.toggle('out', out); }
function narr(html) { var n = $('#narr'); if (!html) { n.classList.remove('show'); return; } n.classList.remove('show'); setTimeout(function () { n.innerHTML = html; n.classList.add('show'); }, n.innerHTML ? 500 : 0); }

function flash(on) { $('#flash').classList.toggle('on', on); }

$('#soundBtn').onclick = function () { AU.unlock(); var m = AU.toggleMute(); this.textContent = m ? '🔇' : '🔊'; };
$$('.btn').forEach(function (b) { b.addEventListener('click', function () { AU.pop(); }); });

$('#startBtn').onclick = function () { AU.startMusic(); $('#intro').classList.add('gone'); startStory(false); };

function resetAll() {
  $('#door').classList.remove('open'); $('#spill').classList.remove('on');
  $$('.fp').forEach(function (e) { e.classList.remove('show'); e.style.transitionDelay = ''; });
  outEl($('#prompt'), true); outEl($('#caption'), true); outEl($('#skip'), true); outEl($('#fireNext'), true);
  $('#fireText').innerHTML = ''; narr('');
  var env = $('#env'); env.classList.remove('opened', 'down'); env.classList.add('wiggle'); $('#envHint').style.opacity = ''; $('#letterTitle').style.opacity = '';
  $('#paper').classList.remove('show'); $('#loveSub').classList.remove('show');
  AU.fire(0); AU.musicLevel(1, 2);
}

async function startStory(replay) {
  var id = ++runId; resetAll();
  show('out'); setSnow(true); camOut.go(V.sky, 0);
  if (replay) await wait(900);
  narr('once upon a snowy night…'); await wait(3600); if (id !== runId) return;
  narr('there was a little cottage<small>made just for the two of us</small>');
  await camOut.go(V.cottage, 5200); if (id !== runId) return;
  await wait(1400); narr(''); await wait(700); if (id !== runId) return;
  // walk up to the door
  $('#bob').classList.add('walking');
  $$('.fp').forEach(function (e, i) { e.style.transitionDelay = (i * .42) + 's'; e.classList.add('show'); });
  var steps = setInterval(function () { AU.crunch(); }, 600);
  await camOut.go(V.door, 5400, 'cubic-bezier(.35,0,.55,1)');
  clearInterval(steps); $('#bob').classList.remove('walking'); if (id !== runId) return;
  await wait(400); outEl($('#prompt'), false); AU.chime(['G5', 'C6'], .035, .15);
}

$('#goIn').onclick = function () { enterHouse(); };
$('#goGame').onclick = function () { openGame(); };
$('#yardSnowman').addEventListener('click', function () { if (current === 'out' && !$('#prompt').classList.contains('out')) openGame(); });

async function enterHouse() {
  var id = ++runId; outEl($('#prompt'), true);
  AU.creak(); $('#door').classList.add('open'); $('#spill').classList.add('on');
  await wait(1500); if (id !== runId) return;
  camOut.go(V.inside, 1900, 'cubic-bezier(.6,0,.85,.5)');
  setTimeout(function () { flash(true); }, 900);
  await wait(1950); if (id !== runId) return;
  setSnow(false); show('room'); camRoom.go(V.roomWide, 0); AU.fire(.35); AU.musicLevel(.8, 2);
  await wait(300); flash(false);
  roomSeq(id);
}

async function roomSeq(id) {
  outEl($('#skip'), false);
  narr('come in, it’s warm in here ♡'); await hold(3000); if (id !== runId) return; narr('');
  for (var i = 0; i < 4; i++) {
    await camRoom.go(frameView(i), 1700); if (id !== runId) return;
    $('#capText').textContent = DATA.photos[i].caption || ''; $('#capNum').textContent = (i + 1) + ' / 4';
    outEl($('#caption'), false); AU.chime([['E6'], ['G6'], ['A6'], ['C7']][i], .03);
    await hold(3600); if (id !== runId) return;
    outEl($('#caption'), true);
  }
  await camRoom.go(V.roomWide, 1700); if (id !== runId) return;
  await hold(900); if (id !== runId) return;
  outEl($('#skip'), true);
  AU.fire(1); AU.musicLevel(.6, 2);
  await camRoom.go(V.fire, 2300); if (id !== runId) return;
  var ft = $('#fireText'); ft.innerHTML = (DATA.fireText || '').split(/\s+/).map(function (w) { var sp = document.createElement('span'); sp.textContent = w; return sp.outerHTML; }).join(' ');
  var spans = $$('span', ft);
  for (var k = 0; k < spans.length; k++) { spans[k].classList.add('on'); await wait(260); if (id !== runId) return; }
  await wait(1500); if (id !== runId) return;
  outEl($('#fireNext'), false);
}
$('#skip').onclick = function () { if (skipFn) skipFn(); };
$('#fireNext').onclick = function () { goLetter(); };

async function goLetter() {
  var id = ++runId; outEl($('#fireNext'), true);
  flash(true); await wait(1000); if (id !== runId) return;
  $('#fireText').innerHTML = '';
  AU.fire(0); AU.musicLevel(.75, 2); show('letter'); setSnow(true);
  await wait(200); flash(false);
}
